[project]
name = "autocare-backend"
version = "0.1.0"
description = "Instant Mechanic API (FastAPI) and diagnosis engine"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "anthropic>=2.2.0",
    "argon2-cffi>=25.1.0",
    "arq>=0.26",
    "boto3>=1.43.123",
    "cryptography>=50.0.2",
    "fastapi>=0.161.1",
    "openai>=3.37.0",
    "openpyxl>=3.1.5",
    "pgvector>=0.5.1",
    "pillow>=13.0.0",
    "pillow-heif>=1.8.1",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.1",
    "pyotp>=2.10.0",
    "pyyaml>=6.0.3",
    "qrcode>=7",
    "sentence-transformers>=6.2.0",
    "sqlalchemy>=2",
    # Pulled in by sentence-transformers; listed so [tool.uv.sources] can point Linux at the CPU-only wheels.
    "torch>=2.14.1,<2.15",
    "uvicorn[standard]>=0.54.0",
]

[project.optional-dependencies]
train = [
    "accelerate>=1",
    "datasets>=3",
]

[tool.uv]
# Not an installable package: run from this folder (uv run uvicorn app.main:app).
package = false

# CPU-only torch on Linux (the Docker images and servers: no CUDA libraries, about 4 GB smaller). macOS keeps the
# PyPI wheel (Apple MPS) for local development and fine-tuning.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.format]
# Applied migrations are never edited (CLAUDE.md), not even by the formatter. Lint still checks them.
exclude = ["alembic/versions/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
# The local alembic/ migrations folder is not the alembic package.
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
# Autogenerated migrations keep long SQL strings on one line.
"alembic/versions/*" = ["E501"]
