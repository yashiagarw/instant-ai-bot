# Local services: PostgreSQL 16 with pgvector, S3-compatible storage for customer photos (SeaweedFS) and Redis for
# background jobs (the dataset publish pipeline's worker runs outside Docker: see README).
#   docker compose up -d db storage redis
# Values come from the root .env (copy .env.example); defaults match it.
services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-autocare}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-autocare}
      POSTGRES_DB: ${POSTGRES_DB:-autocare}
      # Extra database for pytest, created on first start by docker/postgres/init.
      POSTGRES_TEST_DB: ${POSTGRES_TEST_DB:-autocare_test}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible storage for customer photos, development only (SeaweedFS: MinIO no longer publishes free images).
  # The S3 key pair comes from backend/.env (S3_ACCESS_KEY / S3_SECRET_KEY); .env.example has placeholders only.
  # S3 API on :8333. Create the bucket once: cd backend && uv run python -m app.uploads.storage setup
  # Small volumes and a high volume count: the "incoming/ expires after 1 day" rule needs volumes of its own.
  storage:
    image: chrislusf/seaweedfs:3.80
    restart: unless-stopped
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        : "$${S3_ACCESS_KEY:?set S3_ACCESS_KEY in backend/.env}" "$${S3_SECRET_KEY:?set S3_SECRET_KEY in backend/.env}" &&
        printf '{"identities":[{"name":"app","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]}]}'
        "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" > /tmp/s3.json &&
        exec weed server -dir=/data -volume.max=100 -master.volumeSizeLimitMB=64
        -s3 -s3.port=8333 -s3.config=/tmp/s3.json -s3.allowedOrigins="$$WEB_ORIGIN"
    ports:
      - "${S3_PORT:-8333}:8333"
    volumes:
      - storagedata:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8333/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Job queue for the dataset worker (arq). Jobs and their progress are kept in Postgres (dataset_jobs), so Redis
  # needs no persistence: queued jobs are put back on Redis when the worker starts. No UI.
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  storagedata:
