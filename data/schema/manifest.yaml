# Source file manifest for data/raw/. One entry per Excel file.
#
# file_no      - number used in fault keys (F03-ST-01). Taken from the file
#                name; files 7 and 15 have no number in their name.
# main_sheet   - first sheet, the 34-column fault template
# header_row   - 1-based row of the header (checked by scripts/profile_datasets.py)
# split_by     - how rows are assigned to categories:
#                  category_column - by the CATEGORY value
#                  id_prefix       - by the ID prefix (file 9 has one CATEGORY value)
# categories   - ID prefix -> category code used in taxonomy.yaml
#
# Never edit the files in data/raw/. If a file is replaced, update its entry
# here and re-run the profiler.

files:
  - file_no: 1
    path: "data/raw/CLUTCH CATEGORY 1.xlsx"
    main_sheet: "CLUTCH DATASET"
    header_row: 4
    split_by: category_column
    categories: {CL: clutch}
  - file_no: 2
    path: "data/raw/OVERHEATING CATEGORY 2.xlsx"
    main_sheet: "OVER HEATING DATA SET"
    header_row: 3
    split_by: category_column
    categories: {OH: cooling}
  - file_no: 3
    path: "data/raw/STEERING CATEGORY 3.xlsx"
    main_sheet: "STEERING DATASET"
    header_row: 3
    split_by: category_column
