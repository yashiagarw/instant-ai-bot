# ---------------------------------------------------------------------------
# The 13 problem tiles. A category may appear in more than one tile (battery is
# under "Won't start" and "Battery, lights & warning lights").
tiles:
  - code: wont_start
    label_en: "Won't start"
    label_hi: "गाड़ी स्टार्ट नहीं हो रही"
    categories: [self_start, not_starting, battery, ignition_key, starter_motor]
  - code: pickup_jerking
    label_en: "Pickup, jerking, stalling"
    label_hi: "झटके, पिकअप"
    categories: [pickup_throttle, jerking_misfire, sensor_ecu, engine]
  - code: overheating_leaks
    label_en: "Overheating & leaks"
    label_hi: "गाड़ी गरम"
    categories: [cooling, hose_leak]
  - code: ac
    label_en: "AC not cooling"
    label_hi: "AC ठंडा नहीं"
    categories: [ac]
  - code: clutch_gearbox
    label_en: "Clutch & gearbox"
    label_hi: "क्लच और गियर"
    hi_review: true
    categories: [clutch, gearbox]
  - code: brakes_steering
    label_en: "Brakes & steering"
    label_hi: "ब्रेक और स्टीयरिंग"
    hi_review: true
    categories: [brakes, steering]
  - code: suspension_noise
    label_en: "Suspension, noises, loose parts"
    label_hi: "सस्पेंशन, आवाज़, ढीले पुर्ज़े"
    hi_review: true
    categories: [suspension, underbody, engine_belt, exhaust]
  - code: tyres
    label_en: "Tyres"
    label_hi: "टायर"
    hi_review: true
    categories: [tyre]
  - code: battery_lights
    label_en: "Battery, lights & warning lights"
    label_hi: "बैटरी, लाइट और वॉर्निंग लाइट"
    hi_review: true
    categories: [battery, electrical, lights_horn, dashboard_warning]
  - code: fuel_cng_diesel
    label_en: "Fuel, CNG & diesel"
    label_hi: "पेट्रोल, CNG और डीज़ल"
    hi_review: true
    # Each category carries its own fuel filter, so a diesel car sees only diesel.
    categories: [fuel_delivery, cng, diesel]
  - code: ev_hybrid
    label_en: "EV & hybrid"
    label_hi: "EV और हाइब्रिड"
    hi_review: true
    categories: [ev_hybrid]
  - code: body_doors
    label_en: "Body, doors, windows, mirrors"
    label_hi: "बॉडी, दरवाज़े, खिड़की, मिरर"
    hi_review: true
    categories: [body, door_boot_bonnet, window_wiper, mirror, number_plate]
  - code: screen_airbag
    label_en: "Screen, music, camera, airbag light"
    label_hi: "स्क्रीन, म्यूज़िक, कैमरा, एयरबैग लाइट"
    hi_review: true
    categories: [infotainment, airbag_srs]

# ---------------------------------------------------------------------------
# Emergency row: roadside help. Always runs in fast_track mode (max 3
# questions, safety tips, Request a Mechanic), whatever the category's own kind.
# Categories are still filtered by vehicle: "Petrol finished" on a diesel car
# uses the diesel rows, and on an EV it is hidden (see open questions).
emergency:
  mode: fast_track
  wave: 1   # fast-track for the whole row ships in Phase 1 (roadmap)
  topics:
    - code: battery_dead
      label_en: "Battery dead"
      label_hi: "बैटरी डाउन"
      hi_review: true
      categories: [battery]
    - code: flat_tyre
      label_en: "Flat tyre"
      label_hi: "टायर पंक्चर"
      hi_review: true
      categories: [tyre]
    - code: out_of_fuel
      label_en: "Petrol finished"
      label_hi: "पेट्रोल खत्म"
      hi_review: true
      categories: [fuel_delivery, diesel]
    - code: locked_out
      label_en: "Locked out"
      label_hi: "चाबी अंदर, गाड़ी लॉक"
      hi_review: true
      categories: [key_lockout]
    - code: car_stuck
      label_en: "Car stuck"
      label_hi: "गाड़ी फंस गई"
      hi_review: true
      categories: [stuck]
    - code: car_in_water
      label_en: "Car in water"
      label_hi: "गाड़ी पानी में"
      hi_review: true
      categories: [waterlogging]
    - code: accident_tow
      label_en: "Accident / tow"
      label_hi: "एक्सीडेंट / टोइंग"
      hi_review: true
      categories: [towing_accident]
    - code: smoke
      label_en: "Smoke or burning smell"
      label_hi: "धुआं या जलने की बदबू"
      hi_review: true
      categories: [smoke_fire]

# ---------------------------------------------------------------------------
# Inspection booking: checklist from USED_CAR_INSPECTION_CHECKLIST (file 14)
# plus photo upload (Phase 3).
inspection:
  code: book_inspection
  label_en: "Book an inspection"
  label_hi: "जांच बुक करें"
  hi_review: true
  categories: [inspection]
  checklist_source: {file: 14, sheet: USED_CAR_INSPECTION_CHECKLIST}
