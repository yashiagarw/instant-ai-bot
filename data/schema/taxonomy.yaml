# Problem taxonomy: categories, the tiles users tap, the emergency row and
# inspection booking. DRAFT built from the "What the user taps" table in the
# roadmap (23 Oct 2026). Hindi labels marked `hi_review: true` are drafts that
# need a native-speaker check; the first four come from the roadmap.
#
# Becomes an admin screen in Phase 4. Until then, edit this file and re-run
# the tests in scripts/tests/.

version: 1
status: draft

# ---------------------------------------------------------------------------
# Vehicle filters. A category with a filter is shown only when the selected car
# matches. If the field is unknown (unlisted car, user answered "Not sure"),
# the category is shown: a filter hides things only when we know they do not
# apply.
#
# Fuel values: petrol, diesel, cng, hybrid, ev
# Transmission values: mt, amt, cvt, dct, at
vehicle_filters:
  cng:
    fuel: [cng]
  ev_hybrid:
    fuel: [ev, hybrid]
  diesel:
    fuel: [diesel]
  clutch:
    transmission: [mt, amt]
  # Proposed, not in the brief: file 10's fuel rows are about petrol delivery.
  # CNG cars start on petrol and hybrids have a petrol engine. See open questions.
  petrol_engine:
    fuel: [petrol, cng, hybrid]

# ---------------------------------------------------------------------------
# Categories. code is the stable key used by faults and questions.
# sources: file number + ID prefix in data/raw (see manifest.yaml).
# kind:
#   diagnose   - one-at-a-time questions, ranked causes, segment costs
#   fast_track - few questions (max 3), safety tips, then Request a Mechanic
#   inspect    - checklist and booking, photo-led
# wave: rollout wave from the roadmap (1 = Phase 1, 2 = Phase 2, 2.5 = Phase 2-3, 3 = Phase 3)
# beta: shown with a "Beta" label until its questions are reviewed and tuned
categories:
