# How customers in India also spell common car words. `python -m app.knowledge.phrases draft` turns each entry into
# extra customer phrases: an approved dataset phrase containing the word, with the word written the other way, for the
# same fault. No new facts: only spellings of words the dataset already uses.
#
# Sources: common romanised Hindi / Indian English spellings, checked against words the evaluation's DEV split did
# not recognise (never the test split). DRAFT for a Hindi-speaking reviewer.
reviewed_by: claude_code (auto, pending mechanic sign-off)
status: approved

