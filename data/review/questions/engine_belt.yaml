  risk_level: medium
  stop_driving_trigger: Stop if the temperature rises or the battery light is on.
  roadside_action: Stop in a safe place and switch off the engine. Do not open the radiator cap while hot. Call
    a mechanic; tow if the engine overheated.
  towing_recommendation: Yes, if the engine overheated, a pulley is seized, or no belt is available.
  source_text:
    safety_precautions: '• Engine OFF before touching.

      • Never open hot radiator cap.

      • Battery may be weak - jump only by trained mechanic.'
    if_towing_needed: YES if engine overheated, a pulley is seized, or no belt is available.
