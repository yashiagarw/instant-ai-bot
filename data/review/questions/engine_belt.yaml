safety_rules:
- id: engine_belt-s-F11-EB-01
  status: approved
  fault: F11-EB-01
  risk_level: low
  stop_driving_trigger: Stop if the belt breaks or the battery / temperature light comes on.
  roadside_action: Switch off the engine and never touch the belt or pulleys while it runs. The car can usually
    be driven to a garage. Stop if the battery or temperature light comes on.
  towing_recommendation: No, unless the belt breaks or the battery / temperature light comes on.
  source_text:
    safety_precautions: '• Engine OFF and key removed before touching belt.

      • Keep hands, hair, clothes away from a running belt.

      • Hot engine - let it cool.'
    if_towing_needed: NO - unless the belt breaks or battery / temperature light comes ON.
- id: engine_belt-s-F11-EB-02
  status: approved
  fault: F11-EB-02
  risk_level: low
  stop_driving_trigger: Stop if the belt breaks.
  roadside_action: Switch off the engine and never touch the belt or pulleys while it runs. Avoid long trips until
    the belt is changed.
  towing_recommendation: No, unless broken.
  source_text:
    safety_precautions: '• Engine OFF before inspection.

      • Use proper tensioner tool - spring can snap back.'
    if_towing_needed: NO - unless broken.
- id: engine_belt-s-F11-EB-03
  status: approved
