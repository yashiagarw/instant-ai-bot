safety_rules:
- id: ac-s-F05-AC-01
  status: approved
  fault: F05-AC-01
  risk_level: low
  stop_driving_trigger: Not stated
  roadside_action: Switch off the AC. Do not open the AC pipes or use gas cans or leak-seal sprays. Get the AC checked
    at a workshop.
  towing_recommendation: Not normally. Tow only if the belt is broken, the engine is heating, or there is smoke.
  source_text:
    safety_precautions: '• Switch the engine OFF before touching anything under the bonnet.

      • Keep hands, hair and clothes away from the belt, pulley and fans.

      • AC gas is under pressure. Never open AC pipes or release gas.

      • Wear gloves and eye protection near AC lines.

      • Disconnect the battery before any electrical work.

      • Work in open air; keep fire and sparks away.

      • Do not use gas cans or leak-seal chemicals from the market.'
    if_towing_needed: Not normally. Tow only if belt is broken, engine heating, or smoke. No towing rates are listed;
      ask the local recovery operator.
- id: ac-s-F05-AC-02
  status: approved
  fault: F05-AC-02
