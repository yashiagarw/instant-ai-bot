        • Never work under the car when it is held only by a jack. Use axle stands or a ramp.

        • Never leave the engine running unattended during tests. Follow the maker''s workshop manual.

        • Do not road-test a car with unresolved severe overheating. A falling gauge does not prove the car is safe.

        • Do not ask the customer to repeat the overheating as a test.

        • If the needle was in red, treat as possible engine damage until checked.'
      if_towing_needed: '• Needle in red zone or warning still showing

        • Steam or heavy leak

        • Coolant level falls fast

        • Knocking or serious noise

        • Engine cannot keep a safe temperature

        A roadside technician may INSPECT the car, but only a proper check decides if it is safe to drive.

        TOWING FEE NOTE: No fixed fee is stated. Planning assumption (estimate): city flat-bed or hook tow, up to
        20 km, daytime, normal road access, about Rs 1,500 to Rs 3,500 depending on city and car size. Confirm the
        exact rate with the recovery provider.'
