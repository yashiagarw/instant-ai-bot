  safety_rule cooling-s-F02-OH-01:
    id: cooling-s-F02-OH-01
    status: approved
    fault: F02-OH-01
    risk_level: low
    stop_driving_trigger: Stop if the needle goes to red, steam appears or coolant is leaking quickly.
    roadside_action: Top up only through the coolant tank when the engine is cold, and not above MAX. Never open
      the cap on a hot engine.
    towing_recommendation: Not usually. Needed if the needle goes to red, steam appears or coolant is leaking quickly.
    source_text:
      safety_precautions: '• Never open a hot, pressurised cooling system. Never remove the cap to ''check'' if
        the engine is hot.

        • Let the engine cool fully (usually 30 to 60 minutes or more) before any work on the system.

        • Keep hands, hair and clothes away from moving fans and belts. Some fans start by themselves.

        • Wear eye protection and gloves. Do not let coolant touch hot engine parts.

        • Collect used coolant in a container and dispose of it properly. Coolant is poisonous to people and animals.

        • Never work under the car when it is held only by a jack. Use axle stands or a ramp.

        • Never leave the engine running unattended during tests. Follow the maker''s workshop manual.

        • Do not road-test a car with unresolved severe overheating. A falling gauge does not prove the car is safe.

        • Do not add coolant to a hot engine.

        • Do not fill above MAX.'
      if_towing_needed: '• Towing is NOT usually needed for slightly low coolant.

        • Towing is needed if the needle goes to red, steam appears, or coolant is leaking quickly.

        A roadside technician may INSPECT the car, but only a proper check decides if it is safe to drive.

        TOWING FEE NOTE: No fixed fee is stated. Planning assumption (estimate): city flat-bed or hook tow, up to
        20 km, daytime, normal road access, about Rs 1,500 to Rs 3,500 depending on city and car size. Confirm the
        exact rate with the recovery provider.'
  safety_rule cooling-s-F02-OH-02:
    id: cooling-s-F02-OH-02
    status: approved
    fault: F02-OH-02
    risk_level: medium
    stop_driving_trigger: Stop if the needle is in the red or the warning stays on, there is steam or a heavy leak,
      the coolant level falls fast, or there is knocking.
    roadside_action: Stop in a safe place and switch off the engine. Do not open the radiator or coolant cap while
      the engine is hot. Let it cool for 30 to 60 minutes. Keep hands away from the fan and belts.
    towing_recommendation: If the needle is in the red or the warning stays on, steam or heavy leak, coolant falling
      fast, knocking, or the engine cannot keep a safe temperature.
    source_text:
      safety_precautions: '• Never open a hot, pressurised cooling system. Never remove the cap to ''check'' if
        the engine is hot.

        • Let the engine cool fully (usually 30 to 60 minutes or more) before any work on the system.

        • Keep hands, hair and clothes away from moving fans and belts. Some fans start by themselves.

        • Wear eye protection and gloves. Do not let coolant touch hot engine parts.

