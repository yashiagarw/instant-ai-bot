  safety_rule battery-s-F08-BT-01:
    id: battery-s-F08-BT-01
    status: approved
    fault: F08-BT-01
    risk_level: low
    stop_driving_trigger: Not stated
    roadside_action: No fire or smoking near the battery. Remove rings and watch, wear eye protection. Never jump-start
      a swollen or leaking battery.
    towing_recommendation: Usually no. Tow only if the car does not start even after a jump-start.
    source_text:
      safety_precautions: '• No fire or smoking near the battery.

        • Remove rings and watch before touching battery.

        • Wear eye protection.

        • Never jump-start a swollen or leaking battery.'
      if_towing_needed: Usually NO. Tow only if the car does not start even after jump-start.
  safety_rule battery-s-F08-BT-02:
    id: battery-s-F08-BT-02
    status: approved
    fault: F08-BT-02
    risk_level: low
    stop_driving_trigger: Not stated
    roadside_action: Connect jump cables in the right order. Never jump a swollen, leaking or frozen battery. Keep
      cables away from the fan and belt.
    towing_recommendation: No in most cases.
    source_text:
      safety_precautions: '• Connect jump cables in the right order.

        • Never jump a swollen, leaking or frozen battery.

        • Keep cables away from fan and belt.'
      if_towing_needed: NO in most cases.
  safety_rule battery-s-F08-BT-03:
    id: battery-s-F08-BT-03
    status: approved
    fault: F08-BT-03
    risk_level: low
    stop_driving_trigger: Stop if the car stops again while driving.
    roadside_action: Never jump a frozen battery. Charge the battery in open air. Connect + and - correctly.
    towing_recommendation: Only if the car does not start after a jump, or stops again while driving.
    source_text:
      safety_precautions: '• Never jump a frozen battery (cold hill areas).

        • Charge the battery in open air.

        • Connect + and - correctly.'
      if_towing_needed: Only if the car does not start after jump, or stops again while driving.
  safety_rule battery-s-F08-BT-04:
    id: battery-s-F08-BT-04
    status: approved
    fault: F08-BT-04
    risk_level: low
    stop_driving_trigger: Not stated
    roadside_action: 'The powder has acid: wear gloves and goggles. Do not let a spanner touch red (+) and the car
      body together. Keep powder away from paint.'
    towing_recommendation: No.
    source_text:
      safety_precautions: '• Powder has acid. Wear gloves and goggles.

        • Do not let a spanner touch red (+) and car body together.

        • Keep powder away from paint.'
      if_towing_needed: NO.
  safety_rule battery-s-F08-BT-06:
    id: battery-s-F08-BT-06
    status: approved
    fault: F08-BT-06
    risk_level: medium
    stop_driving_trigger: Stop if the battery light is ON and the battery is going down fast.
    roadside_action: Remove the battery wire before removing the alternator wire. Keep hands away from the moving
      belt.
    towing_recommendation: Depends. Tow if the battery light is ON and the battery is going down fast.
    source_text:
      safety_precautions: '• Remove battery wire before removing alternator wire.

        • Keep hands away from moving belt.'
      if_towing_needed: DEPENDS. Tow if battery light is ON and battery is going down fast.
  safety_rule battery-s-F08-BT-07:
    id: battery-s-F08-BT-07
    status: approved
    fault: F08-BT-07
    risk_level: medium
    stop_driving_trigger: Not stated
    roadside_action: No jump-start on a swollen, leaking or frozen battery. Red to +, black to engine metal. No
      fire or sparks near the battery. Do not let the clamps touch each other.
    towing_recommendation: Only if the jump fails, or the car is not charging / stops.
    source_text:
      safety_precautions: '• No jump on swollen, leaking or frozen battery.

        • Red to + , black to engine metal.

        • No fire or sparks near battery.

        • Do not let clamps touch each other.'
      if_towing_needed: Only if jump fails, or car is not charging / stops.
  safety_rule battery-s-F08-BT-08:
    id: battery-s-F08-BT-08
    status: approved
    fault: F08-BT-08
    risk_level: medium
    stop_driving_trigger: Stop if the battery light is ON, voltage is falling or the car is stopping.
    roadside_action: Keep away from the belt and fan when the engine runs. Remove the battery wire before electrical
      work.
    towing_recommendation: Depends. Tow if the light is ON, voltage is falling or the car is stopping.
    source_text:
      safety_precautions: '• Keep away from belt and fan when engine runs.

        • Remove battery wire before electrical work.'
      if_towing_needed: DEPENDS. Tow if light is ON, voltage falling or car stopping.
  safety_rule battery-s-F08-BT-10:
    id: battery-s-F08-BT-10
    status: approved
    fault: F08-BT-10
    risk_level: medium
    stop_driving_trigger: Stop if the battery is hot or smelling.
    roadside_action: An over-charged battery can give gas that catches fire. Remove the battery wire before work.
    towing_recommendation: Depends. Tow if the battery is hot or smelling.
    source_text:
      safety_precautions: '• Over-charged battery can give fire-catching gas.

        • Remove battery wire before work.'
      if_towing_needed: DEPENDS. Tow if battery is hot or smelling.
  safety_rule battery-s-F08-BT-11:
    id: battery-s-F08-BT-11
    status: approved
    fault: F08-BT-11
    risk_level: medium
