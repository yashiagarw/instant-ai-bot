    source_text:
      safety_precautions: '- Use a lift or stands and a gearbox jack; never work under a car on a jack alone

        - Clutch dust may be harmful; use a wet cleaner and a mask, never an air gun

        - Disconnect the battery for starter or AMT work

        - Never get past a failing clutch by starting in gear'
      if_towing_needed: '- Gear cannot be put in (towing needed)

        - Noise getting louder or turning into grinding or rattling

        - Pedal loose or stuck to the floor

        - Car in an unsafe position or on a slope'
  safety_rule clutch-s-F01-CL-07:
    id: clutch-s-F01-CL-07
    status: approved
    fault: F01-CL-07
    risk_level: medium
    stop_driving_trigger: Stop if the pedal stays on the floor and no gear goes in, or the brake fluid level is
      also dropping.
    roadside_action: Do not force the gear lever or the pedal, and do not start the car in gear. Put on the hazard
      lights and the handbrake. If the brake pedal also feels different, do not drive. Call for a tow.
    towing_recommendation: If the pedal stays on the floor and no gear can be selected, fluid is leaking quickly,
      or the brake fluid level is also dropping.
    source_text:
      safety_precautions: '- Wheel blocks, handbrake and neutral before any work

        - Never work under a car held only by a jack; use stands

        - Brake/clutch fluid is harmful to paint and skin; wear gloves and eye protection

        - Use only the fluid type the car maker specifies; do not mix fluid types'
      if_towing_needed: '- Pedal stays on the floor and no gear can be selected

        - Fluid is leaking quickly, or the brake fluid level is also dropping

        - Car in an unsafe position or on a slope

