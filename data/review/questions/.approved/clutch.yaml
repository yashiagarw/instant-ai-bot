  fault F01-CL-01:
    status: approved
    name: Clutch feels stiff or heavy
    stage2_choices:
    - Clutch pedal is heavy or stiff
    confirmation_test: Pedal feels normal after oiling, adjusting or bleeding; otherwise disconnect the cable at
      the gearbox end and compare the effort.
    danger_phrases:
    - pedal will not come back
    safety_trigger_options: []
  fault F01-CL-02:
    status: approved
    name: Clutch slipping
    stage2_choices:
    - Engine revs go up but the car does not speed up
    - Burning smell from the clutch
    confirmation_test: Standing test (car does not stall) and lining thickness check with the gearbox out; recheck
      after adjusting free play or bleeding.
    danger_phrases:
    - smoke
    - strong burning smell
    safety_trigger_options:
    - question: clutch-q01
      option: Smoke or a strong burning smell
  fault F01-CL-03:
    status: approved
    name: Clutch cable broken
    stage2_choices:
    - Clutch pedal is soft, loose or stays on the floor
    - Hard to change gears, or a gear will not go in
    confirmation_test: See the break, or the inner wire does not move at the gearbox end when the pedal is pressed.
    danger_phrases: []
    safety_trigger_options:
    - question: clutch-q01
      option: The engine runs but the car will not move
    - question: clutch-q02
      option: No gear goes in
    - question: clutch-q04
      option: No, it stays on the floor
  fault F01-CL-04:
    status: approved
    name: Clutch plate worn out
    stage2_choices:
    - Engine revs go up but the car does not speed up
    - Clutch catches too high or too low
    - Burning smell from the clutch
    confirmation_test: Lining thinner than the minimum, or shiny or oily, when checked with the gearbox out.
    danger_phrases:
    - smoke
    - strong burning smell
    safety_trigger_options:
    - question: clutch-q01
      option: Smoke or a strong burning smell
  fault F01-CL-05:
    status: approved
    name: Clutch completely failed
    stage2_choices:
    - Clutch pedal is soft, loose or stays on the floor
    - Hard to change gears, or a gear will not go in
    - Engine revs go up but the car does not speed up
    confirmation_test: Check the outside parts (cable, fluid system) first, then remove the gearbox and check the
      clutch.
    danger_phrases:
    - car will not move
    - gear stuck
    safety_trigger_options:
    - question: clutch-q01
      option: The engine runs but the car will not move
    - question: clutch-q02
      option: No gear goes in
    - question: clutch-q14
      option: Grinding or a metal rattle
  fault F01-CL-06:
    status: approved
    name: Noise when clutch pedal is pressed; gear will not engage
    stage2_choices:
    - Noise from the clutch or the pedal
    - Hard to change gears, or a gear will not go in
    confirmation_test: Noise only while the pedal is pressed, linkage and fluid normal; bearing checked with the
      gearbox out.
    danger_phrases:
    - grinding
    - metal rattle
    safety_trigger_options:
    - question: clutch-q02
      option: No gear goes in
    - question: clutch-q14
      option: Grinding or a metal rattle
  fault F01-CL-07:
    status: approved
    name: Clutch pedal stuck to the floor
    stage2_choices:
    - Clutch pedal is soft, loose or stays on the floor
    - Hard to change gears, or a gear will not go in
    confirmation_test: Find which part leaks or does not move (cylinders, pipe, hose, cable, return spring, pedal
      pin).
    danger_phrases:
    - brake fluid dropping
    safety_trigger_options:
    - question: clutch-q01
      option: The engine runs but the car will not move
    - question: clutch-q02
      option: No gear goes in
    - question: clutch-q04
      option: No, it stays on the floor
    - question: clutch-q19
      option: 'Yes'
  fault F01-CL-08:
    status: approved
    name: Clutch pedal too soft or spongy
    stage2_choices:
    - Clutch pedal is soft, loose or stays on the floor
    confirmation_test: Pedal becomes firm after bleeding; if it goes soft again quickly, the cylinder or hose is
      at fault.
    danger_phrases:
    - pedal sinks to the floor
    safety_trigger_options:
    - question: clutch-q04
      option: No, it stays on the floor
  fault F01-CL-09:
    status: approved
    name: Clutch not disengaging (clutch drag)
    stage2_choices:
    - Hard to change gears, or a gear will not go in
    confirmation_test: Correct the free play / air first; if still dragging, remove the gearbox and inspect the
      disc, pressure plate and splines.
    danger_phrases:
    - car moves with the pedal pressed
    safety_trigger_options:
    - question: clutch-q02
      option: No gear goes in
    - question: clutch-q11
      option: 'Yes'
  fault F01-CL-10:
    status: approved
    name: Difficulty changing gears
    stage2_choices:
    - Hard to change gears, or a gear will not go in
    confirmation_test: Engine-off versus engine-running test, gear oil and linkage checks.
    danger_phrases:
    - gear jumps out
    safety_trigger_options: []
  fault F01-CL-11:
    status: approved
    name: Clutch judder or vibration
    stage2_choices:
    - Car shakes when moving off
    confirmation_test: Check mounts and leaks first; clutch surfaces and flywheel with the gearbox out.
    danger_phrases:
    - violent shaking
