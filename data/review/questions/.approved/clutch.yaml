    confirmation_test: Noise stops after lubricating the pedal pivot and return spring.
    danger_phrases: []
    safety_trigger_options: []
  fault F01-CL-13:
    status: approved
    name: Noise when the clutch pedal is released
    stage2_choices:
    - Noise from the clutch or the pedal
    confirmation_test: Pedal-position noise test; bearing checked by hand with the gearbox out.
    danger_phrases:
    - metal rattle
    - loss of drive
    safety_trigger_options:
    - question: clutch-q14
      option: Grinding or a metal rattle
  fault F01-CL-14:
    status: approved
    name: Clutch burning smell or overheating
    stage2_choices:
    - Burning smell from the clutch
    - Engine revs go up but the car does not speed up
    confirmation_test: Smell only after heavy use with no slipping afterwards = driving habit; repeated smell with
      slipping = worn clutch.
    danger_phrases:
    - smoke
    safety_trigger_options:
    - question: clutch-q01
      option: Smoke or a strong burning smell
