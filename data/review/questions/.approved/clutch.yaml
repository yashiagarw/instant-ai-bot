        - Clutch dust may be harmful; use a wet cleaner and a mask, never an air gun'
      if_towing_needed: '- No gear can be selected

        - The car moves by itself with the pedal pressed

        - Burning smell or grinding

        - Car in an unsafe position or on a slope'
  safety_rule clutch-s-F01-CL-10:
    id: clutch-s-F01-CL-10
    status: approved
    fault: F01-CL-10
    risk_level: medium
    stop_driving_trigger: Stop if no gear can be selected, there is loud grinding, or a gear jumps out.
