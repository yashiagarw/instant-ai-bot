  safety_rule clutch-s-F01-CL-08:
    id: clutch-s-F01-CL-08
    status: approved
    fault: F01-CL-08
    risk_level: medium
    stop_driving_trigger: Stop if the pedal sinks to the floor or the clutch does not release.
    roadside_action: Do not force the gear lever or the pedal, and do not start the car in gear. Put on the hazard
      lights and the handbrake. Get the clutch checked soon.
    towing_recommendation: If the pedal sinks to the floor or the clutch does not release, no gear can be selected,
