    source_text:
      safety_precautions: '- Brake/clutch fluid is harmful to paint and skin; wear gloves and eye protection and
        clean spills at once

        - Wheel blocks, handbrake and neutral before any work

        - Never work under a car held only by a jack; use stands

        - Dispose of used fluid properly'
      if_towing_needed: '- Fluid leaking quickly, or the pedal sinks to the floor

        - The brake fluid level is dropping too

        - No gear can be selected

        - Leak is inside the gearbox gearbox cover (gearbox removal needed)'
