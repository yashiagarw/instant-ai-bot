    status: approved
    name: Hydraulic clutch fluid leak
    stage2_choices:
    - Clutch fluid is leaking or keeps dropping
    - Clutch pedal is soft, loose or stays on the floor
    confirmation_test: Find the wet part; a falling level with no outside leak points to an internal leak.
    danger_phrases:
    - brake fluid dropping
    - pedal sinks to the floor
    safety_trigger_options:
    - question: clutch-q19
      option: 'Yes'
  fault F01-CL-16:
    status: approved
    name: Clutch engages too low or too high
    stage2_choices:
    - Clutch catches too high or too low
    confirmation_test: Adjustment or bleeding changes the bite point (system fault); a high bite point with slipping
      that does not change = wear.
    danger_phrases: []
    safety_trigger_options: []
  safety_rule clutch-s-F01-CL-01:
    id: clutch-s-F01-CL-01
    status: approved
    fault: F01-CL-01
    risk_level: medium
    stop_driving_trigger: Stop if the pedal will not press fully or will not come back, no gear can be selected,
      or fluid leaks and the pedal sinks.
    roadside_action: Do not force the gear lever or the pedal, and do not start the car in gear. Put on the hazard
      lights and the handbrake. If the pedal stays down or no gear goes in, call a mechanic.
    towing_recommendation: If the pedal will not press fully or will not come back, no gear can be selected, or
      fluid is leaking and the pedal sinks to the floor.
    source_text:
      safety_precautions: '- Wheel blocks, handbrake and neutral before any work

        - Never work under a car held only by a jack; use stands

        - Brake fluid (shared by some fluid clutches) is harmful; keep it off paint and skin

        - Wear gloves and eye protection'
      if_towing_needed: '- Pedal will not press fully or will not come back

        - No gear can be selected

        - Fluid is visibly leaking and the pedal sinks to the floor'
  safety_rule clutch-s-F01-CL-02:
    id: clutch-s-F01-CL-02
    status: approved
    fault: F01-CL-02
    risk_level: medium
    stop_driving_trigger: Stop if there is a strong burning smell or smoke, the car cannot move, or it slips even
      in low gears.
    roadside_action: Stop in a safe place and let the clutch cool. If there is smoke or the car will not move, call
      for a tow.
    towing_recommendation: If the car cannot move by itself, there is a strong burning smell or smoke, or the clutch
      slips even in low gears on flat ground.
    source_text:
      safety_precautions: '- Do the standing test only on level ground with the handbrake fully on and people kept
        away

        - Never use the standing test on automatic, AMT or DCT cars

        - Use stands if any work under the car is needed'
      if_towing_needed: '- Car cannot move by itself

        - Strong burning smell or smoke

        - Clutch slips even in low gears on flat ground'
  safety_rule clutch-s-F01-CL-03:
    id: clutch-s-F01-CL-03
    status: approved
    fault: F01-CL-03
    risk_level: medium
    stop_driving_trigger: Do not drive if no gear can be selected.
    roadside_action: Do not force the gear lever or the pedal, and do not start the car in gear. Put on the hazard
      lights and the handbrake. Call a mechanic; a cable can often be fixed on the spot.
    towing_recommendation: If the right cable is not available on the road, there is damage at the gearbox, or the
      car is in an unsafe place.
    source_text:
      safety_precautions: '- Wheel blocks, handbrake and hazard lights

        - Never work under a car held only by a jack

        - Keep hands away from the pedal linkage while testing

        - Do not force the gear lever'
      if_towing_needed: '- The correct cable is not available on the road

        - Damage found on the fork, bracket or gearbox cover

        - Unsafe place (highway side, steep slope)

        - Car with a fluid clutch, AMT or DCT where a cable is not the cause'
  safety_rule clutch-s-F01-CL-04:
    id: clutch-s-F01-CL-04
    status: approved
    fault: F01-CL-04
    risk_level: medium
    stop_driving_trigger: Stop if it slips badly, there is a burning smell or smoke, or gears cannot be put in.
    roadside_action: Avoid hills and heavy loads. If there is smoke or the car barely moves, stop and call for a
      tow.
    towing_recommendation: If slipping badly and the car barely moves, burning smell or smoke, gears cannot be put
      in, or unsafe road conditions.
    source_text:
      safety_precautions: '- Use a lift or stands and a gearbox jack; never work under a car on a jack alone

        - Clutch dust may contain harmful particles; use a wet cleaner and a mask, never an air gun

        - Disconnect the battery before removing the starter

        - Tighten bolts to the correct level'
      if_towing_needed: '- Slipping badly, car barely moves

        - Burning smell or smoke

        - Gears cannot be put in

        - Unsafe road conditions'
  safety_rule clutch-s-F01-CL-05:
    id: clutch-s-F01-CL-05
    status: approved
    fault: F01-CL-05
    risk_level: high
    stop_driving_trigger: 'Do not drive: tow unless a mechanic finds a simple cable fault.'
    roadside_action: Do not force the gear lever or the pedal, and do not start the car in gear. Put on the hazard
      lights and the handbrake. Move away from traffic if you can do it safely, and call for a tow.
    towing_recommendation: Always, unless the cause is a simple cable that can be fixed on the spot.
    source_text:
      safety_precautions: '- Use a lift or stands and a gearbox jack; never work under a car on a jack alone

        - Do not use an air gun on clutch dust; use a wet cleaner and a mask

        - Disconnect the battery for electrical/AMT work

        - Never get past a failed clutch by starting in gear'
      if_towing_needed: '- Always, unless the cause is a simple cable (CL-03) that can be fixed on the spot

        - Fluid leak, failure inside or noisy bearing

        - AMT/DCT fault

        - Car in an unsafe position or on a slope'
  safety_rule clutch-s-F01-CL-06:
    id: clutch-s-F01-CL-06
    status: approved
    fault: F01-CL-06
    risk_level: medium
    stop_driving_trigger: Stop if no gear goes in, the noise turns into grinding or rattling, or the pedal is loose
