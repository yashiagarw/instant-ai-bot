  safety_rule clutch-s-F01-CL-09:
    id: clutch-s-F01-CL-09
    status: approved
    fault: F01-CL-09
    risk_level: medium
    stop_driving_trigger: Stop if the car moves by itself with the pedal pressed, or no gear can be selected.
    roadside_action: Do not force the gear lever or the pedal, and do not start the car in gear. Put on the hazard
