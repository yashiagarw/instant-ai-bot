  safety_rule diesel-s-F17-DS-01:
    id: diesel-s-F17-DS-01
    status: approved
    fault: F17-DS-01
    risk_level: low
    stop_driving_trigger: Not stated
    roadside_action: Park in a safe place with hazard lights on. Ask for diesel delivery or go to the nearest pump.
      Never put AdBlue in the diesel tank.
    towing_recommendation: Only if fuel delivery is not available.
    source_text:
      safety_precautions: • Never put AdBlue in the diesel tank, or diesel in the AdBlue tank.
      if_towing_needed: Only if delivery not available.
  safety_rule diesel-s-F17-DS-02:
    id: diesel-s-F17-DS-02
    status: approved
    fault: F17-DS-02
    risk_level: low
    stop_driving_trigger: Not stated
    roadside_action: Refill with the correct AdBlue (blue cap tank). Never put AdBlue in the diesel tank.
    towing_recommendation: No.
    source_text:
      safety_precautions: '• Never put AdBlue in the diesel tank, or diesel in the AdBlue tank.

        • Do not use unapproved fuel or DEF additives.'
      if_towing_needed: NO.
  safety_rule diesel-s-F17-DS-03:
    id: diesel-s-F17-DS-03
    status: approved
    fault: F17-DS-03
    risk_level: medium
    stop_driving_trigger: The car may not restart once the countdown ends.
    roadside_action: Drive to the dealer before the countdown ends. Do not disable any emission parts.
    towing_recommendation: If the countdown has ended.
    source_text:
      safety_precautions: • Do not remove or disable DPF, SCR, EGR or other emission systems.
      if_towing_needed: If countdown ended.
  safety_rule diesel-s-F17-DS-04:
    id: diesel-s-F17-DS-04
    status: approved
    fault: F17-DS-04
    risk_level: medium
    stop_driving_trigger: Stop if the engine runs badly.
    roadside_action: If the engine runs roughly or knocks, stop in a safe place. Do not add any fuel additives.
      Call a mechanic.
    towing_recommendation: If running badly.
    source_text:
      safety_precautions: '• Do not use unapproved fuel or DEF additives.

        • Never loosen common-rail injector pipes - extremely high pressure.'
      if_towing_needed: If running badly.
  safety_rule diesel-s-F17-DS-05:
    id: diesel-s-F17-DS-05
    status: approved
    fault: F17-DS-05
    risk_level: low
    stop_driving_trigger: Not stated
    roadside_action: Refuel. Do not keep cranking for long. If it does not start after refuelling, call a mechanic.
    towing_recommendation: If it does not start after refuelling.
    source_text:
      safety_precautions: • Never loosen common-rail injector pipes - extremely high pressure.
      if_towing_needed: If no start after refuel.
  safety_rule diesel-s-F17-DS-06:
    id: diesel-s-F17-DS-06
    status: approved
    fault: F17-DS-06
