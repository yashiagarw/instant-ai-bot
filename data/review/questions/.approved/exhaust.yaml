  safety_rule exhaust-s-F16-EX-01:
    id: exhaust-s-F16-EX-01
    status: approved
    fault: F16-EX-01
    risk_level: low
    stop_driving_trigger: Stop if you smell exhaust inside the car or a part is dragging.
    roadside_action: Do not touch the exhaust, it stays very hot after driving. The car can be driven to a garage.
