        • Never put any body part under a car held only by a jack.

        • Do not repair a tyre with a bulge, a big cut or exposed cords.

        • Tighten wheel nuts in a cross pattern with the correct torque.

        • Do not work if traffic or ground is unsafe.'
      if_towing_needed: 'Roadside help is enough in most cases. Towing is needed only if: the tyre cannot hold air,
        no safe spare is available, the rim looks bent, or the car is in an unsafe place.'
