    risk_level: medium
    stop_driving_trigger: Stop in a safe place away from traffic. Do not fill air into a bulged, cut or very hot
      tyre.
    roadside_action: Use hazard lights and do not stand on the roadside. Do not over-fill; let a hot tyre cool before
