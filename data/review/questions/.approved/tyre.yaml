        • Work only on firm, flat ground.

        • Use only the maker''s jacking points.

        • NEVER put any body part under a car held by a jack.

        • Tighten the wheel nuts in a cross pattern with the correct torque.

        • Do not touch a hot tyre or rim.

        • If unsafe, do not work. Call help.'
      if_towing_needed: 'Roadside assistance is enough if the spare is good and the place is safe. Towing is needed
        if: no usable spare, spare size is wrong, more than one tyre is flat, rim is bent or cracked, the car is
