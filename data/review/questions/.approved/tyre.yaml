  fault F04-TY-01:
    status: approved
    name: Low air pressure
    stage2_choices:
    - One tyre looks a little soft or low, but it is not flat
    - The tyre goes soft again after I fill it with air
    confirmation_test: A mechanic measures the tyre pressure with a gauge and tests the valve with soapy water before
      saying it is a puncture. After filling to the correct pressure, check the tyre again after 24 hours and after
      3–7 days.
    danger_phrases:
    - tyre nearly flat
    - burning smell
    - car pulls strongly to one side
    - burst tyre
    - bulge
    - deep cut
    - bent wheel
    - very hot tyre
    safety_trigger_options:
    - question: tyre-q02
      option: 'Yes'
    - question: tyre-q07
      option: 'Yes'
  fault F04-TY-02:
    status: approved
    name: Slow/pinhole puncture
    stage2_choices:
    - One tyre looks a little soft or low, but it is not flat
    - The tyre goes soft again after I fill it with air
    confirmation_test: A mechanic finds the leak and confirms it with soapy water or a water-tank test that shows
      bubbles at the exact spot. A tyre shop must also check the inside of the tyre.
    danger_phrases:
    - tyre is soft
    - bulge
    - pulls to one side
    - tyre cannot hold air
    - bent rim
    - unsafe place
    safety_trigger_options:
    - question: tyre-q02
      option: 'Yes'
  fault F04-TY-03:
    status: approved
    name: Flat tyre
    stage2_choices:
    - The tyre is fully or almost fully flat
    confirmation_test: A mechanic removes the tyre and inspects it inside and outside. They must check both the
      tyre and rim before deciding whether to repair or replace it.
    danger_phrases:
    - fully flat tyre
    - almost flat tyre
    - car leaning to one side
    - rim close to the road
    - rubber smell
    - pieces of rubber
    safety_trigger_options:
    - question: tyre-q10
      option: Fully or almost fully flat
    - question: tyre-q12
      option: A cut, tear, or bulge
    - question: tyre-q14
      option: No, it is near moving traffic or in an unsafe place
  fault F04-TY-04:
    status: approved
    name: Valve issue
    stage2_choices:
    - One tyre looks a little soft or low, but it is not flat
    - The tyre goes soft again after I fill it with air
    confirmation_test: A mechanic confirms the leak with soapy water showing bubbles at the valve only. The mechanic
      should check the valve core first, then the stem, then the seal; if bubbles appear elsewhere, the cause is
      uncertain.
    danger_phrases:
    - tyre very soft
    - damaged valve
    - damaged wheel
    - rim damaged
    - tyre cannot hold air
    safety_trigger_options: []
  fault F04-TY-05:
    status: approved
    name: Tyre burst/sidewall damage
    stage2_choices:
    - The tyre burst, or I can see a bulge or cut on its side
    confirmation_test: A mechanic checks the tyre inside and outside, and checks the rim and the other tyres for
      hidden damage.
    danger_phrases:
    - tyre burst
    - loud bang then flat
    - bulge
    - bubble on tyre
    - deep cut
    - threads visible
    - tyre smoking
    - rubber smell
    safety_trigger_options:
    - question: tyre-q03
      option: I can see a bent wheel
    - question: tyre-q18
      option: A bulge, deep cut, or threads are visible
    - question: tyre-q18
      option: The tyre has burst or torn open
    - question: tyre-q19
      option: A loud bang, then the tyre went flat
  fault F04-TY-06:
    status: approved
    name: Multi-tyre/rim damage caused by pothole impact
    stage2_choices:
    - After hitting a pothole, more than one tyre or wheel seems affected, or the car shakes
    confirmation_test: A mechanic must inspect every wheel and tyre, including the inside of the tyres, and check
      wheel balance. The mechanic must also check all four wheels and the suspension; a wheel alignment check is
      needed after repair.
    danger_phrases:
    - bent wheel
    - cracked rim
    - steering shakes
    - car pulls
    - two or more tyres losing air
    - two or more tyres unusable
    safety_trigger_options:
    - question: tyre-q03
