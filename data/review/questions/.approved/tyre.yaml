  safety_rule tyre-s-F04-TY-04:
    id: tyre-s-F04-TY-04
    status: approved
    fault: F04-TY-04
    risk_level: low
    stop_driving_trigger: Not stated
    roadside_action: Park safely away from traffic. Do not fill air into a damaged valve or wheel. Do not remove
      a valve core from a high-pressure tyre without care. Use jacking points only, never go under a car supported
      by a jack, tighten wheel nuts in a cross pattern, and do not damage the TPMS sensor when opening the tyre.
    towing_recommendation: Towing is not normally needed; roadside help is enough in most cases. Tow only if the
