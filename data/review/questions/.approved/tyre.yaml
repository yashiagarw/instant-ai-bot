      safety_precautions: '• Park safely, away from traffic.

        • Do not fill air into a damaged valve or damaged wheel.

        • Do not remove a valve core from a tyre that has high pressure without care (the air can blow out).

        • Use jacking points only. Never go under the car on a jack.

        • Tighten wheel nuts in a cross pattern.

        • Do not damage the TPMS sensor while opening the tyre.'
      if_towing_needed: Towing is not normally needed. Roadside help is enough in most cases. Towing is needed only
        if the tyre cannot hold air and there is no usable spare, or the rim is damaged.
  safety_rule tyre-s-F04-TY-05:
    id: tyre-s-F04-TY-05
    status: approved
    fault: F04-TY-05
    risk_level: high
    stop_driving_trigger: Stop at once. Do not drive on a burst or bulged tyre, and never inflate a cut or bulged
      tyre.
    roadside_action: Park away from traffic, switch on hazard lights and use a triangle. Keep people away from the
      damaged wheel. Do not work if traffic or the ground is unsafe, touch a hot tyre or rim, or put any body part
      under a car held only by a jack. If changing a wheel, use only the maker’s jacking points and tighten the
      nuts in a cross pattern to the correct torque.
    towing_recommendation: Roadside help is enough if the place is safe and the spare is good. Tow if there is no
      safe spare, the spare is the wrong size, the rim is bent or cracked, suspension or steering damage is suspected,
      more than one tyre is unusable, or the car is in an unsafe place.
    source_text:
      safety_precautions: '• Stop at once. Do not drive on a burst or bulged tyre.

        • Park away from traffic. Hazard lights and triangle.

        • Keep people away from the damaged wheel. It may burst.

        • Never inflate a cut or bulged tyre.

        • Use only the maker''s jacking points.

        • NEVER put any body part under a car held only by a jack.

        • Do not touch a hot tyre or rim.

        • Tighten nuts in a cross pattern to the correct torque.

        • Do not work if traffic or ground is unsafe.'
      if_towing_needed: 'Roadside help is enough if the place is safe and the spare is good. Towing is needed if:
        no safe spare, spare is the wrong size, rim is bent or cracked, suspension or steering damage is suspected,
        more than one tyre is unusable, or the car is in an unsafe place.'
  safety_rule tyre-s-F04-TY-06:
    id: tyre-s-F04-TY-06
    status: approved
    fault: F04-TY-06
    risk_level: high
    stop_driving_trigger: Stop at once and do not drive. Stop if a wheel looks bent, the steering shakes, or the
      car pulls.
    roadside_action: Park away from traffic, switch on hazard lights and use a triangle. Keep people away from the
      damaged wheel. Do not fill air into a bent or cracked wheel or touch a hot tyre or rim. Use only the maker's
      jacking points; never put any body part under a car held only by a jack. Do not work if traffic or ground
      is unsafe. Roadside help can inspect the car.
    towing_recommendation: Towing is needed if more than one tyre is unusable, the rim is cracked or badly bent,
      steering or suspension may be damaged, no good spare is available, or the car is in an unsafe place.
    source_text:
      safety_precautions: '• Stop at once. Do not drive.

        • Park away from traffic. Hazard lights and triangle.

        • Keep people away from the damaged wheel.

        • Do not fill air into a bent or cracked wheel.

        • Do not touch a hot tyre or rim.

        • Use only the maker''s jacking points.

        • NEVER put any body part under a car held only by a jack.

        • Tighten nuts in a cross pattern to the correct torque.

        • Do not work if traffic or ground is unsafe.'
      if_towing_needed: 'Roadside help can inspect the car. Towing is needed if: more than one tyre is unusable,
        the rim is cracked or badly bent, the steering or suspension may be damaged, no good spare is available,
        or the car is in an unsafe place. Towing estimate: about ₹1,500-2,500 for a flatbed within 10-15 km in a
        city. SUV or premium car: about ₹2,500-4,000. Extra km: about ₹40-60 per km. Actual price depends on city,
        distance, and time of day. Ask the provider before booking.'
