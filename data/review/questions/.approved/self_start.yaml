    risk_level: low
    stop_driving_trigger: Stop and tow if the engine cannot rotate, or if there is smoke, flood exposure, a hot
      or locked wheel, unsafe brakes or gearbox damage.
    roadside_action: Do not try to bypass safety switches or force the engine, gears or brakes. Do not touch hot
      or moving parts, and do not go under the car. Call a mechanic.
    towing_recommendation: Tow if the engine cannot rotate, smoke, flood exposure, a hot or locked wheel, unsafe
      brakes, gearbox damage or no safe roadside fix. Use model-approved recovery.
