  safety_rule ev_hybrid-s-F06-EV-01:
    id: ev_hybrid-s-F06-EV-01
    status: approved
    fault: F06-EV-01
    risk_level: low
    stop_driving_trigger: Stop charging if there is smoke, a burning smell or heat.
    roadside_action: Stop charging at once if you notice smoke, a burning smell or heat. Do not use damaged cables
      or adapters. The car can be driven if there is no warning, smell or heat.
    towing_recommendation: Not needed if there is no warning, smell or heat. Do not keep charging with faulty equipment.
    source_text:
      safety_precautions: '• Do not use damaged cables or adapters to get more speed.

        • Never touch exposed or orange high-voltage wiring.

        • Do not continue charging with melted plastic, arcing, smoke, unusual heat or a burning smell.

        • If smoke, fire or suspected battery thermal runaway occurs: move away, call emergency services, tell them
        it is an electric vehicle.'
      if_towing_needed: Drive normally only if there is no warning, smell or heat. Towing not needed. Do not keep
        charging with faulty equipment.
