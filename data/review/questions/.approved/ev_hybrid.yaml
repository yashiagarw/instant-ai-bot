        • Do not handle a damaged or flooded HV battery.

        • Use trained EV staff, approved insulated tools and the maker''s isolation procedure.

        • If smoke, fire or suspected battery thermal runaway occurs: move away, call emergency services, tell them
        it is an electric vehicle.'
      if_towing_needed: 'Do not drive and do not restart the car. Park in an open place away from buildings and
        people. Ask roadside help for a flatbed. Neutral or wheels-on-road towing only if the exact model''s manual
        allows. Reason: possible high-voltage, heat or fire risk.'
