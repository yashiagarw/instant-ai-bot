  safety_rule ev_hybrid-s-F06-EV-03:
    id: ev_hybrid-s-F06-EV-03
    status: approved
    fault: F06-EV-03
    risk_level: medium
    stop_driving_trigger: Do not drive far if a warning or reduced-power message shows.
    roadside_action: Do not drive far if a warning or reduced-power message shows. Never touch orange high-voltage
      cables. If the car cannot move safely, call for a flatbed tow.
    towing_recommendation: Do not drive far with a warning or reduced-power message. Flatbed if the car cannot start
      or move safely.
    source_text:
      safety_precautions: '• Never touch exposed or orange high-voltage wiring.

        • Never open the traction battery, onboard charger or HV junction box (customer or unqualified mechanic).

        • Do not bypass any HV interlock or safety protection.

        • Do not insert tools into charging connector pins.

        • Do not use water or liquids to clean an electrical connector.

        • Do not continue charging with melted plastic, arcing, smoke, unusual heat or a burning smell.

        • Do not handle a damaged or flooded HV battery.

        • Use trained EV staff, approved insulated tools and the maker''s isolation procedure.

        • If smoke, fire or suspected battery thermal runaway occurs: move away, call emergency services, tell them
        it is an electric vehicle.'
      if_towing_needed: Do not drive far if a warning lamp or reduced-power message shows. If the car cannot start
        or move safely, use a flatbed (platform) truck. Follow this exact model's recovery guide before moving it
        on its wheels.
