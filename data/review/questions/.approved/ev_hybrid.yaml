      Never touch orange high-voltage cables. If there is smoke or fire, move away and call emergency services (say
      it is an electric car). Call for a flatbed tow.
    towing_recommendation: Flatbed. Do not drive or restart (possible high-voltage, heat or fire risk).
    source_text:
      safety_precautions: '• Never touch exposed or orange high-voltage wiring.

        • Never open the traction battery, onboard charger or HV junction box (customer or unqualified mechanic).

        • Do not bypass any HV interlock or safety protection.

