safety_rules:
- id: steering-s-F03-ST-01
  status: approved
  fault: F03-ST-01
  risk_level: high
  stop_driving_trigger: Do not drive if the wheel is jammed or heavy and control is uncertain.
  roadside_action: Slow down smoothly, hold the wheel firmly with both hands, switch on the hazard lights and stop
    in a safe place. Do not drive on. Call for a tow.
  towing_recommendation: Yes, if the wheel is jammed or heavy and control is uncertain.
  source_text:
    safety_precautions: Park on flat ground, hazard lights on, handbrake on. Use axle stands, never a jack alone.
      Disconnect battery before touching EPS wiring (follow maker procedure; airbag wiring is in the column). Keep
      hands away from belts. Do not test-drive a car with doubtful steering. Do not bypass or force the steering
      lock.
    if_towing_needed: Towing needed if the wheel is jammed or heavy and control is uncertain, because you may not
      be able to steer away from danger.
- id: steering-s-F03-ST-02
  status: approved
  fault: F03-ST-02
  risk_level: low
  stop_driving_trigger: Not stated
  roadside_action: Gently turn the steering wheel left and right while turning the key or pressing start. Do not
    force it.
  towing_recommendation: Not normally. Only if the lock stays stuck after proper checks.
  source_text:
    safety_precautions: Park on flat ground, hazard lights on, handbrake on. Use axle stands, never a jack alone.
      Disconnect battery before touching EPS wiring (follow maker procedure; airbag wiring is in the column). Keep
      hands away from belts. Do not test-drive a car with doubtful steering. Do not bypass or force the steering
      lock.
    if_towing_needed: Towing normally not needed. Tow only if the lock stays stuck after proper checks and the car
      cannot be moved safely.
