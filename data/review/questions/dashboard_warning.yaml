safety_rules:
- id: dashboard_warning-s-F10-DW-01
  status: approved
  fault: F10-DW-01
  risk_level: medium
  stop_driving_trigger: Stop if the light is red.
  roadside_action: If the light is red, stop in a safe place and switch off the engine. If it is yellow, drive gently
    to a garage.
  towing_recommendation: Depends on the light.
  source_text:
    safety_precautions: • Red lights - stop safely.
    if_towing_needed: DEPENDS on the light.
- id: dashboard_warning-s-F10-DW-02
  status: approved
  fault: F10-DW-02
  risk_level: low
  stop_driving_trigger: Stop if the red brake light is also on or the brakes feel different.
  roadside_action: Drive carefully and keep a bigger gap, because ABS may be off. Book a scan.
  towing_recommendation: No, if the brakes feel normal and there is no red brake light.
  source_text:
    safety_precautions: '• Test drive in safe place.

      • Car on stands for wheel work.'
    if_towing_needed: NO if brakes feel normal and no red brake light.
- id: dashboard_warning-s-F10-DW-03
  status: approved
  fault: F10-DW-03
  risk_level: medium
  stop_driving_trigger: Stop if the steering is heavy.
  roadside_action: If the steering is heavy, stop in a safe place. Check that the battery terminals are tight. If
    it stays heavy, call for a tow.
  towing_recommendation: Yes, if the steering stays heavy.
  source_text:
    safety_precautions: • Heavy steering = accident risk.
    if_towing_needed: YES if steering stays heavy.
- id: dashboard_warning-s-F10-DW-04
  status: approved
  fault: F10-DW-04
  risk_level: medium
  stop_driving_trigger: Stop if the brakes or steering do not feel normal.
  roadside_action: Check the brakes and steering first. Check that the battery terminals are tight. If the car drives
    oddly, stop and call a mechanic.
  towing_recommendation: Depends on how the car drives.
  source_text:
    safety_precautions: • Check brakes/steering first.
    if_towing_needed: DEPENDS.
