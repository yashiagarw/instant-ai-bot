# How short safety lines from the datasets read to customers. The datasets hold many shorthand lines written for
# mechanics ("Acid burns.", "Stands.", "Battery OFF for wiring."). On the result page a customer sees only full,
# calm sentences they can act on:
#   1. a line listed under `rewrite` is shown as its sentence ("" = never shown);
#   2. otherwise workshop instructions (tools, lifts, fuses, wiring, tests: patterns in
#      backend/app/diagnosis/safety_lines.py) and fragments (under 4 words, "X = Y" shorthand) are left out;
#   3. what remains is shown with calm capitalisation (OFF -> off).
# Keys: the line in lower case without its final full stop. Several dataset lines can share one sentence.
# Check every line's result with:  cd backend && uv run python -m app.diagnosis.safety_lines report
#
# DRAFT, reviewed: false (Oct 2026). Have the team read every sentence before launch.
reviewed: false

