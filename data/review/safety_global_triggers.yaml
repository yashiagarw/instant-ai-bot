# Trigger phrases for the global emergency rules (the "EMERGENCY - ..." lines of the SAFETY_AND_TOWING_RULES sheets).
# Without an entry here, the app takes a global rule's phrases from its heading ("smoke, sparks or a burning plastic
# smell" -> smoke, sparks, burning plastic smell). The heading word "smoke" alone also matched exhaust smoke
# ("black smoke from the exhaust"), a running problem, not a fire, so these rules list where the smoke is instead.
# Applied with:  cd backend && uv run python -m app.knowledge.safety_triggers apply   (re-run after every import)
# Rules are found by their sheet row (source_ref). A phrase fires when all its words are in the message.
reviewed_by: claude_code (auto, pending mechanic sign-off)

# Roadside action values that are not advice (7 Nov 2026): "No - None." is the road-repairable value that landed in
# the roadside action column of 68 file 12 rules. Cleared on apply (kept in details.sheet_roadside_action), so each
# rule's own stop-driving text is its advice and alerts are no longer merged just because they share this value.
placeholder_roadside_actions:
  - "No - None."

smoke_locations: &smoke
  - smoke from bonnet
  - smoke from engine bay
  - smoke under bonnet
  - smoke from wires
  - smoke from wiring
  - wire smoke
  - smoke from dashboard
  - smoke from vents
  - smoke in cabin
  - smoke inside car
  - bonnet dhuan
  - wire dhuan
  - taar dhuan
  - wiring dhuan
  - dashboard dhuan

rules:
  "F12 SAFETY_AND_TOWING_RULES r87":  # If there is smoke, sparks or a burning plastic smell: stop safely ...
    phrases: [sparks, burning plastic smell, burning smell, jalne badbu, jalane badbu, chingari, *smoke]
  "F18 SAFETY_AND_TOWING_RULES r68":  # Anyone injured, trapped, fire, smoke or fuel leak: call 112 first ...
    # Fuel smell together with smoke (7 Nov 2026; Hindi "पेट्रोल की गंध ... धुआं" reads as "petrol gandh ... dhuan").
    # Fuel smell alone is left to the fuel faults' own rules.
    phrases: [anyone injured, trapped, fire, flames, aag, fuel leak, petrol leak, *smoke,
              petrol gandh dhuan, petrol badbu dhuan, petrol smell dhuan, diesel gandh dhuan, diesel badbu dhuan,
              petrol smell smoke, fuel smell smoke, diesel smell smoke]
  "F18 SAFETY_AND_TOWING_RULES r70":  # Engine stopped in water: do NOT restart. Flatbed + engine inspection.
    # 7 Nov 2026. The engine stopped while in water: each Hinglish phrase needs "band" (stopped) as well. Hindi
    # "पानी में डूब ... बंद" reads as "paani dub ... band". "paani doob" alone (the car was under water earlier) is
    # left to the flood faults' own rules; "paani engine band" alone also matches AC water dripping.
    phrases: [stopped in water, stalled in water, died in water, engine submerged,
              paani doob band, pani doob band, paani dub band, pani dub band, paani doobi band]
