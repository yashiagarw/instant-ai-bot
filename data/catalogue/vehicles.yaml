# Vehicle catalogue seed: popular cars in Delhi NCR (India).
# Load or update with:  cd backend && uv run python -m app.vehicles.seed
#
# Structure: make -> model -> variants. Each variant line expands to one row per
# transmission in `transmissions`.
#   years:     [from, to]  (to = null means still on sale)
#   fuel:      petrol | diesel | cng | hybrid | ev     (ev = pure battery EV; hybrid = strong hybrid)
#   transmissions: mt | amt | cvt | dct | at          (cvt includes hybrid e-CVT; at = torque converter / EV single speed)
#   segment:   budget (below Rs 10 lakh ex-showroom) | mid (10-25 lakh) | premium (above 25 lakh)
#   engine:    optional; needed when two variants share fuel + transmission + years (e.g. "1.0 Turbo")
#   features:  optional, on a model (all its variants) or a variant (overrides): known true / false car features
#              that some faults need, e.g. {start_stop: false}. Codes: backend/app/vehicles/features.py. Leave a
#              feature out when unsure: unknown never changes a ranking; false down-ranks faults that need it.
#              Which features are still missing: docs/diagnosis-engine.md ("Car features").
#
# REVIEW BEFORE LAUNCH. Years and segments were compiled from public launch dates and
# ex-showroom price ranges (Oct 2026) and have not been checked by the team. Models whose
# price range crosses a boundary are split by the typical price of that fuel / gearbox,
# so a top trim may sit one segment higher. Older generations are not listed: users with
# those cars use "My car isn't listed" and pick fuel, gearbox and price band.
# EVs and hybrids are variants of their parent model (Nexon EV = Nexon, fuel ev).

