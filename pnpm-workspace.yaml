# One pnpm workspace: the customer site, the staff admin app and the shared UI package.
packages:
  - apps/*
  - packages/*

ignoredBuiltDependencies:
  # next-intl's optional message extractor (not used): prebuilt binaries, no install script needed
  - "@parcel/watcher"
  - "@swc/core"
  - sharp
  - unrs-resolver

# Security fixes for transitive packages (Phase 5.4, pnpm audit): minimatch < 11.0.1 (GHSA-g3hv-75wg-m249, only in the
# ESLint toolchain) to the patched major.
overrides:
  "minimatch@>=7.0.0 <11.0.1": "^11.0.1"

